<section class="section contact-section" id="contatti" aria-labelledby="contact-title"><div class="contact-copy"><p class="eyebrow">Parliamone</p><h2 id="contact-title">Da dove vuoi iniziare?</h2><p>Raccontaci di cosa hai bisogno. Troveremo insieme il trattamento più adatto a te.</p><a class="button button--dark" href="https://wa.me/390000000000" target="_blank" rel="noreferrer">Scrivi su WhatsApp <span aria-hidden="true">↗</span></a></div><form class="contact-form" (ngSubmit)="submit()" #contactForm="ngForm"><label for="name">Il tuo nome</label><input id="name" name="name" required ngModel autocomplete="name" placeholder="Come ti chiami?" /><label for="message">Di cosa hai bisogno?</label><textarea id="message" name="message" required ngModel rows="4" placeholder="Una breve nota, con calma."></textarea><button class="button button--light" type="submit" [disabled]="contactForm.invalid">Invia richiesta <span aria-hidden="true">→</span></button>@if (sent()) { <p class="form-success" role="status">Grazie. Il modulo è pronto per il collegamento al servizio di prenotazione.</p> }</form></section>
